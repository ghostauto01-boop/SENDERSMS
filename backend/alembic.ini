# Alembic configuration for SENDERSMS.
#
# The app's runtime schema safety net is app/schema_repair.py (additive-only
# ALTER TABLE at startup). These migrations are the *durable, reviewable*
# record of every database change and the upgrade path operators run
# deliberately:
#
#     cd backend && alembic upgrade head
#
# env.py picks the database up from app.config (DATABASE_URL), so no
# sqlalchemy.url needs to be pasted here.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# Filled in by env.py from settings.DATABASE_URL.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
