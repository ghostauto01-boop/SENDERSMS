name: Native WordPress compatibility
on:
  push:
    branches: [arena/d761f7c5-sendersms]
    paths: ['wordpress/sender-suite/**', 'wordpress/tools/native-*', '.github/workflows/wordpress-native.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: isolated-wordpress-test-only
          MYSQL_DATABASE: sender_suite_wordpress_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent -pisolated-wordpress-test-only"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f
        with:
          php-version: '8.3'
          extensions: mysqli, pdo_mysql, mbstring, openssl, sodium
          coverage: none
      - name: Obtain pinned WordPress source
        run: |
          git clone --depth 1 --branch 6.8.3 https://github.com/WordPress/WordPress.git "$RUNNER_TEMP/wordpress"
          test "$(git -C "$RUNNER_TEMP/wordpress" rev-parse HEAD)" = ba9e7f97f08a7fbb88fbfa35641bcc230500b37a
      - name: Install isolated WordPress and activate native plugin
        env:
          NATIVE_WP_ROOT: ${{ runner.temp }}/wordpress
          NATIVE_WP_EVIDENCE: ${{ runner.temp }}/native-wordpress
          NATIVE_DB_PASSWORD: isolated-wordpress-test-only
        run: |
          mkdir -p "$NATIVE_WP_EVIDENCE"
          php wordpress/tools/native-wordpress.php
      - name: Actual HTTP requests with real cookies, WordPress and MySQL
        env:
          NATIVE_WP_ROOT: ${{ runner.temp }}/wordpress
          NATIVE_WP_EVIDENCE: ${{ runner.temp }}/native-wordpress
        run: |
          php -S 127.0.0.1:8080 -t "$NATIVE_WP_ROOT" > "$NATIVE_WP_EVIDENCE/server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          python3 wordpress/tools/native-http.py
      - name: Store exact native results (never production credentials)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-wordpress-evidence
          path: |
            ${{ runner.temp }}/native-wordpress/native-install.json
            ${{ runner.temp }}/native-wordpress/native-http.json
            ${{ runner.temp }}/native-wordpress/server.log
          if-no-files-found: error
          retention-days: 14
