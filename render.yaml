# ============================================================
# SendSMS - Render Blueprint (Free Tier - No Card)
# ============================================================
#
# PREREQUISITE before applying this Blueprint:
#   1. Create a free Neon PostgreSQL database (neon.tech)
#   2. Create a free Upstash Redis database (upstash.com)
#   3. Copy both connection URLs
#   4. Apply this Blueprint and fill in the env vars
#
# ============================================================

services:
  - type: web
    name: sendsms-api
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: |
      pip install --upgrade pip && pip install -r requirements.txt
      npm ci && npm run build
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CREDENTIAL_ENCRYPTION_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: CORS_ORIGINS
        sync: false
      - key: DEFAULT_TIMEZONE
        value: Africa/Lagos
      # Public URL used to register the SMS-Gate inbound webhook.
      # Render injects RENDER_EXTERNAL_URL automatically; set this explicitly
      # if you serve the app behind a custom domain.
      - key: PUBLIC_BASE_URL
        sync: false
      # Signing key from the SMS-Gate device (Settings -> Webhooks -> Signing Key).
      # Without it, inbound webhooks are rejected with 401.
      - key: SMSGATE_WEBHOOK_SECRET
        sync: false
      - key: SMSGATE_USERNAME
        sync: false
      - key: SMSGATE_PASSWORD
        sync: false
      # Automatic background polling, run inside the API process.
      # Every INLINE_POLL_INTERVAL seconds this refreshes delivery statuses
      # (sent -> delivered/failed) and sends any due scheduled messages.
      # Inbound SMS still arrives instantly by webhook push; this is the
      # safety net that needs no Celery worker and no manual button.
      - key: ENABLE_INLINE_POLLER
        value: "true"
      - key: INLINE_POLL_INTERVAL
        value: "30"
    healthCheckPath: /api/v1/health

  - type: web
    name: sendsms-worker
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: cd backend && python app/worker_web.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: CREDENTIAL_ENCRYPTION_KEY
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DEFAULT_TIMEZONE
        value: Africa/Lagos
      - key: PUBLIC_BASE_URL
        sync: false
      - key: SMSGATE_WEBHOOK_SECRET
        sync: false
      - key: SMSGATE_USERNAME
        sync: false
      - key: SMSGATE_PASSWORD
        sync: false
    healthCheckPath: /health
