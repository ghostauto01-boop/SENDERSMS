# ============================================================
# SendSMS - Render Blueprint (Free Tier - No Card)
# ============================================================
#
# PREREQUISITE before applying this Blueprint:
#   1. Create a free Neon PostgreSQL database (neon.tech)
#   2. Create a free Upstash Redis database (upstash.com)
#   3. Copy both connection URLs
#   4. Apply this Blueprint and fill in the env vars
#
# ============================================================

services:
  - type: web
    name: sendsms-api
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: |
      pip install --upgrade pip && pip install -r requirements.txt
      npm ci && npm run build
    startCommand: cd backend && python -m uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-10000} --proxy-headers
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CREDENTIAL_ENCRYPTION_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: CORS_ORIGINS
        sync: false
      - key: DEFAULT_TIMEZONE
        value: Africa/Lagos
      # The public HTTPS address of THIS service. Everything that has to be
      # reached from outside depends on it:
      #   - the SMS-Gate inbound webhook (no replies to your SMS without it)
      #   - the Brevo inbound webhook and the email unsubscribe link
      #   - every URL in the MCP OAuth metadata (ChatGPT/Claude reject a
      #     relative or mismatched `resource`, so the connectors cannot connect)
      #   - the Gmail OAuth redirect URI
      # Render injects RENDER_EXTERNAL_URL automatically and the app falls back
      # to it; set this explicitly if you serve the app behind a custom domain.
      # The in-app Setup Guide (/setup) flags it if it is still missing.
      - key: PUBLIC_BASE_URL
        sync: false
      # --- Email replies (Gmail) -------------------------------------------
      # Poll interval, in seconds, for every connected mailbox. The inline
      # poller and the worker both honour it, and it is idempotent, so running
      # both is safe.
      - key: GMAIL_POLL_INTERVAL
        value: "60"
      # Move replies Gmail filed as spam back into the inbox and import them.
      - key: GMAIL_RESCUE_FROM_SPAM
        value: "true"
      # Send one-to-one replies from the connected mailbox instead of Brevo, so
      # the thread stays in Gmail and does not look spoofed to the prospect.
      - key: GMAIL_SEND_REPLIES
        value: "true"
      # Optional. Leave empty to connect Gmail with an app password over IMAP
      # (no Google Cloud project needed). Fill both to also offer the
      # "Sign in with Google" button, which unlocks the spam-rescue API and the
      # "never send it to Spam" filter. Register the redirect URI
      # <PUBLIC_BASE_URL>/api/v1/mailbox/google/callback in the OAuth client.
      - key: GOOGLE_CLIENT_ID
        value: ""
      - key: GOOGLE_CLIENT_SECRET
        value: ""
      # --- AI connectors (MCP) ---------------------------------------------
      # ChatGPT / Claude / Arena connect over OAuth 2.1 at
      # <PUBLIC_BASE_URL>/connectors/<client>/mcp.
      - key: MCP_OAUTH_ENABLED
        value: "true"
      # Signing key from the SMS-Gate device (Settings -> Webhooks -> Signing Key).
      # Without it, inbound webhooks are rejected with 401.
      - key: SMSGATE_WEBHOOK_SECRET
        sync: false
      - key: SMSGATE_USERNAME
        sync: false
      - key: SMSGATE_PASSWORD
        sync: false
      # Automatic background polling, run inside the API process.
      # Every INLINE_POLL_INTERVAL seconds this refreshes delivery statuses
      # (sent -> delivered/failed) and sends any due scheduled messages.
      # Inbound SMS still arrives instantly by webhook push; this is the
      # safety net that needs no Celery worker and no manual button.
      - key: ENABLE_INLINE_POLLER
        value: "true"
      - key: INLINE_POLL_INTERVAL
        value: "30"
    healthCheckPath: /api/v1/health

  - type: web
    name: sendsms-worker
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: cd backend && python app/worker_web.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: CREDENTIAL_ENCRYPTION_KEY
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DEFAULT_TIMEZONE
        value: Africa/Lagos
      - key: PUBLIC_BASE_URL
        sync: false
      - key: SMSGATE_WEBHOOK_SECRET
        sync: false
      - key: SMSGATE_USERNAME
        sync: false
      - key: SMSGATE_PASSWORD
        sync: false
      # This service runs `celery worker -B`, so it is the one that executes the
      # sync-connected-mailboxes beat task: keep these identical to the API
      # service. Importing a reply twice is prevented by an idempotency key, so
      # running this and the inline poller together is safe.
      - key: GMAIL_POLL_INTERVAL
        value: "60"
      - key: GMAIL_RESCUE_FROM_SPAM
        value: "true"
      - key: GMAIL_SEND_REPLIES
        value: "true"
      - key: GOOGLE_CLIENT_ID
        value: ""
      - key: GOOGLE_CLIENT_SECRET
        value: ""
    healthCheckPath: /health
